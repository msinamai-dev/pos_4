<!DOCTYPE html>

{% load static %}

{% block pageContent %}
<div class="mdc-layout-grid__cell stretch-card mdc-layout-grid__cell--span-12">
    <div class="mdc-card py-2">
        <div class="d-flex justify-content-between align-items-center">
            <h4 class="card-title mb-0">📂 Category Form</h4>
        </div>
    </div>
</div>

<div class="mdc-layout-grid__cell stretch-card mdc-layout-grid__cell--span-12">
    <div class="mdc-card p-3">
        <form action="" id="category-form">
            <input type="hidden" name="id" value="{% if category.pk %}{{ category.pk }}{% endif %}">

            <!-- Category Name -->
            <div class="form-group mb-3">
                <label for="name" class="form-label">Category Name</label>
                <input type="text" name="name" id="name" 
                       class="form-control form-control-sm rounded-0" 
                       value="{% if category.name %}{{ category.name }}{% endif %}" required>
            </div>

            <!-- Description -->
            <div class="form-group mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea rows="5" name="description" id="description" 
                          class="form-control form-control-sm rounded-0" required>{% if category.description %}{{ category.description }}{% endif %}</textarea>
            </div>

            <!-- Status -->
            <div class="form-group mb-3">
                <label for="status" class="form-label">Status</label>
                <select name="status" id="status" class="form-select form-select-sm rounded-0" required>
                    {% if category.status == 1 %}
                        <option value="1" selected>Active</option>
                    {% else %}
                        <option value="1">Active</option>
                    {% endif %}

                    {% if category.status == 0 %}
                        <option value="0" selected>Inactive</option>
                    {% else %}
                        <option value="0">Inactive</option>
                    {% endif %}
                </select>
            </div>

            
        </form>
    </div>
</div>

<script>
$(function() {
    $('#category-form').submit(function(e) {
        e.preventDefault();
        var _this = $(this);
        $('.err-msg').remove();
        var el = $('<div>').addClass("alert alert-danger err-msg").hide();

        if (_this[0].checkValidity() == false) {
            _this[0].reportValidity();
            return false;
        }

        start_loader();
        $.ajax({
            headers: {
                "X-CSRFToken": '{{ csrf_token }}'
            },
            url: "{% url 'save-category-page' %}",
            data: new FormData($(this)[0]),
            cache: false,
            contentType: false,
            processData: false,
            method: 'POST',
            type: 'POST',
            dataType: 'json',
            error: err => {
                console.log(err);
                alert_toast("An error occurred", 'error');
                end_loader();
            },
            success: function(resp) {
                if (typeof resp == 'object' && resp.status == 'success') {
                    el.removeClass("alert alert-danger err-msg");
                    location.reload();
                } else if (resp.status == 'failed' && !!resp.msg) {
                    el.text(resp.msg);
                } else {
                    el.text("An error occurred");
                    console.error(resp);
                }
                _this.prepend(el);
                el.show('slow');
                $("html, body, .modal").scrollTop(0);
                end_loader();
            }
        });
    });
});
</script>
{% endblock pageContent %}
