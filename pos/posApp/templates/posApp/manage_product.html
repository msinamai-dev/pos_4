{% load l10n %}
<div class="container-fluid">
  <form action="" id="product-form">
    <input type="hidden" name="id" value="{% if product.pk %}{{ product.pk }}{% endif %}">
    {% csrf_token %}

    <div class="form-group mb-3">
      <label>Product Name</label>
      <input type="text" name="name" class="form-control form-control-sm" value="{{ product.name|default:'' }}" required>
    </div>

   
<div class="form-group mb-3">
  <label>Product Code</label>
  <input type="text" name="code" class="form-control form-control-sm" value="{{ product.code|default:'' }}" optional placeholder="Leave blank to auto-generate">
</div>

    

    <div class="form-group mb-3">
      <label>Category</label>
      <select name="category_id" class="form-select form-select-sm" required>
        <option value="">Select Category</option>
        {% for cat in categories %}
          <option value="{{ cat.id }}" {% if product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group mb-3">
  <label>Sold By</label>
  <select name="unit" class="form-select form-select-sm">
    <option value="each" {% if product.unit == "each" %}selected{% endif %}>Each</option>
    <option value="kg" {% if product.unit == "kg" %}selected{% endif %}>Kilogram (kg)</option>
    <option value="g" {% if product.unit == "g" %}selected{% endif %}>Gram (g)</option>
    <option value="l" {% if product.unit == "l" %}selected{% endif %}>Litre (l)</option>
    <option value="ml" {% if product.unit == "ml" %}selected{% endif %}>Millilitre (ml)</option>
    <option value="m" {% if product.unit == "m" %}selected{% endif %}>Metres(m)</option>
  </select>
</div>

    <div class="row">
      <div class="col-6">
        <div class="form-group mb-3">
          <label>Selling Price</label>
          <input type="number" name="price" step="0.01" min="0" class="form-control form-control-sm" value="{{ product.price|default_if_none:0|unlocalize }}">
        </div>
      </div>
      <div class="col-6">
        <div class="form-group mb-3">
          <label>Cost Price</label>
          <input type="number" name="cprice" step="0.01" min="0" class="form-control form-control-sm" value="{{ product.cprice|default_if_none:0|unlocalize }}">
        </div>
      </div>
    </div>

    <div class="form-group mb-3">
      <label>Description</label>
      <textarea name="description" rows="4" class="form-control form-control-sm">{{ product.description|default:'' }}</textarea>
    </div>

    <div class="form-group mb-3">
      <label>Status</label>
      <select name="status" class="form-select form-select-sm">
        <option value="1" {% if product.status %}selected{% endif %}>Active</option>
        <option value="0" {% if product and not product.status %}selected{% endif %}>Inactive</option>
      </select>
    </div>

    <div class="text-end">
      <button type="submit" class="btn btn-primary btn-sm">Save Product</button>
    </div>
  </form>
</div>

<script>
$(function(){
  $('#product-form').submit(function(e){
    e.preventDefault();
    var _this = $(this);
    start_loader();
    $.ajax({
      url: "{% url 'save-product-page' %}",
      method: "POST",
      data: new FormData(_this[0]),
      processData: false,
      contentType: false,
      dataType: "json",
      success:function(resp){
        if(resp.status === 'success'){
          location.reload();
        } else {
          alert(resp.msg || "Failed to save product.");
        }
        end_loader();
      },
      error:function(err){
        console.error(err);
        alert("An error occurred.");
        end_loader();
      }
    });
  });
});
</script>
