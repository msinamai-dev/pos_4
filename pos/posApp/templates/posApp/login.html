{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page_title %}{{ page_title }} | {% endif %}MS POS System</title>

  <!-- Styles -->
  <link rel="stylesheet" href="{% static 'posApp/assets/bootstrap/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'posApp/assets/default/css/style.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'posAPP/css/consistent-tables.css' %}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card narrow">
      <div class="auth-head">
        <img src="{% static 'posAPP/ICOM.png' %}" alt="Logo">
        <h3>MS POS SYSTEM</h3>
        <p>Sign in to your account</p>
      </div>

      <div class="auth-body">
        <!-- Alert placeholder -->
        <div id="alert-box"></div>

        <!-- Login Form -->
        <form id="login-user" method="post" class="pos-form">
          {% csrf_token %}
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" name="username" id="username" class="form-control" required autofocus>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="position-relative">
              <input type="password" name="password" id="password" class="form-control" style="padding-right:46px" required>
              <button type="button" id="togglePassword" aria-label="Show or hide password"
                      style="position:absolute;top:50%;right:12px;transform:translateY(-50%);border:none;background:transparent;padding:0;font-size:1.15rem;line-height:1;cursor:pointer;">
                👁
              </button>
            </div>
          </div>

          <div class="mb-3 form-check d-flex align-items-center gap-2">
            <input type="checkbox" class="form-check-input m-0" id="remember_me" name="remember_me">
            <label class="form-check-label mb-0" for="remember_me">Remember me</label>
          </div>

          <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
      </div>

      <div class="auth-foot">
        Don't have an account? <a href="{% url 'register-user' %}">Create Account</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="{% static 'posApp/assets/default/js/jquery-3.6.0.min.js' %}"></script>
  <script src="{% static 'posApp/assets/bootstrap/js/bootstrap.bundle.min.js' %}"></script>

  <script>
    // CSRF token helper
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        document.cookie.split(';').forEach(cookie => {
          cookie = cookie.trim();
          if (cookie.startsWith(name + '=')) cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        });
      }
      return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');

    $(function() {
      // Toggle password visibility
      $('#togglePassword').click(function() {
        const input = $('#password');
        const type = input.attr('type') === 'password' ? 'text' : 'password';
        input.attr('type', type);
        $(this).text(type === 'password' ? '👁' : 'X');
      });

      // AJAX login
      $('#login-user').submit(function(e) {
        e.preventDefault();
        $('#alert-box').html(""); // clear old alerts

        $.ajax({
          url: "{% url 'login-user' %}",
          method: "POST",
          data: $(this).serialize(), // Use serialize for URL-encoded data
          headers: { "X-CSRFToken": csrftoken },
          dataType: "json",
          success: function(resp) {
            if (resp.status === 'success') {
              window.location.href = "{% url 'pos-page' %}";
            } else {
              showAlert('danger', resp.msg || 'Invalid username or password.');
            }
          },
          error: function(xhr) {
            showAlert('danger', xhr.responseJSON?.msg || 'An unexpected error occurred.');
          }
        });
      });

      // Alert helper
      function showAlert(type, message) {
        $('#alert-box').html(`
          <div class="alert alert-${type} alert-dismissible fade show mt-2" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        `);
      }
    });
  </script>
</body>
</html>
