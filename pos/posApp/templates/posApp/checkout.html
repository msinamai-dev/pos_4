{% load humanize %}
<div class="container-fluid">
    <form action="" id="checkout-form">
        <div class="form-group mb-3">
            <label for="payable_amount" class="control-label">Payable Amount ({{ currency }})</label>
            <input type="text" id="payable_amount" step="0.01" class="form-control form-control-lg rounded-0 text-end" value="{{ grand_total|intcomma }}" required disabled>
        </div>
        <div class="form-group mb-3">
            <label for="tendered_amount" class="control-label">Amount Tendered ({{ currency }})</label>
            <input type="number" step="0.01" id="tendered_amount" class="form-control form-control-lg rounded-0 text-end" value="" min="0.10" required>
        </div>
        <div class="form-group mb-3">
            <label for="payment_change" class="control-label">Change ({{ currency }})</label>
            <input type="text" id="payment_change"  step="0.01" class="form-control form-control-lg rounded-0 text-end" value="{{ 0|intcomma }}" required disabled>
        </div>
    </form>
</div>
<script>
    $(function() {
        $('#tendered_amount').on('input keypress keyup keydown', function() {
            var tendered_amount = $('#tendered_amount').val()
            var payable = $('#payable_amount').val()
            tendered_amount = tendered_amount.replace(/,/gi, '')
            payable = payable.replace(/,/gi, '')
            var change = 0
            tendered_amount = tendered_amount > 0 ? tendered_amount : 0;
            $('[name="tendered_amount"]').val(tendered_amount)
            // everything here is in the selected currency ({{ currency }}); round to cents
            change = Math.round((parseFloat(tendered_amount) - parseFloat(payable)) * 100) / 100
            $('#payment_change').val(change.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }))
            $('[name="amount_change"]').val(change)

        })
        $('#checkout-form').submit(function(e) {
            e.preventDefault();
            if ($('[name="amount_change"]').val() < 0) {
                alert("Tendered Amount is lower that Payable Amount")
                return false;
            }
            $('#pos-form').submit()
        })
    })
</script>
