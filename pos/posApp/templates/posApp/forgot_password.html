{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password | TG POS</title>
  <link rel="stylesheet" href="{% static 'posApp/assets/bootstrap/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'posApp/assets/material-admin/css/demo/style.css' %}">
  <script src="{% static 'posApp/assets/default/js/jquery-3.6.0.min.js' %}"></script>
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card p-4 shadow" style="width: 100%; max-width: 500px;">
      <div class="text-center mb-4">
        <img src="{% static 'posAPP/logo (1).png' %}" alt="Logo" style="width: 50px;">
        <h3 class="mt-2">TG POS SYSTEM</h3>
        <p>Enter your email to reset your password</p>
      </div>

      <form method="POST" id="forgot-password-form">
        {% csrf_token %}
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" name="email" id="email" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-warning w-100">Send Reset Link</button>
      </form>

      <div class="text-center mt-3">
        <small>Remembered your password? <a href="{% url 'login' %}">Sign in</a></small>
      </div>
    </div>
  </div>

  <script>
    $('#forgot-password-form').submit(function(e) {
      e.preventDefault();
      var formData = new FormData(this);
      $.ajax({
        headers: { "X-CSRFToken": $('input[name="csrfmiddlewaretoken"]').val() },
        url: "{% url 'forgot-password' %}",
        method: "POST",
        data: formData,
        processData: false,
        contentType: false,
        dataType: 'json',
        success: function(resp) {
          if (resp.status === 'success') {
            alert("Reset link sent to your email.");
          } else {
            alert(resp.message || "Email not found.");
          }
        },
        error: function(err) {
          console.error(err);
          alert("An error occurred.");
        }
      });
    });
  </script>
</body>
</html>
