
<h2>Assign Pages to Users</h2>
<form method="POST" action="{% url 'assign_page' %}">
  {% csrf_token %}
  <label>Page:</label>
  <select name="page_id">
    {% for page in pages %}
      <option value="{{ page.id }}">{{ page.title }}</option>
    {% endfor %}
  </select>

  <label>User:</label>
  <select name="user_id">
    {% for user in users %}
      <option value="{{ user.id }}">{{ user.username }}</option>
    {% endfor %}
  </select>

  <button type="submit">Assign</button>
</form>
