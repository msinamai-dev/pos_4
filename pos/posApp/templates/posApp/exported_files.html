{% extends "posApp/base.html" %}
{% block pageContent %}
<div class="container">
    <h2>Exported Activities</h2>
    <table class="table pos-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Download</th>
            </tr>
        </thead>
        <tbody>
            {% for exp in exports %}
            <tr>
                <td>{{ exp.date }}</td>
                <td>
                    <a href="{{ exp.file.url }}" class="btn btn-sm btn-primary">Download</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2" class="text-center">No exports available</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
